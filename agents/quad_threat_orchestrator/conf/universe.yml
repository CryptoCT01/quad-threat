# Shared trading universe for Hummingbot multi-pair v3.7 SCALP
# Read by: dashboard server + live controller
# leverage = Bitget USDT-M leverage used on entry
#
# Session 9 tuning (loss review):
#   - max slots 3 → 2 (lower fee surface)
#   - trail wider, TP wider, cooldown longer
#   - score_threshold 0.55 (require stronger agreement)
#   - drop XAG (chop), add CL oil perp

max_open_positions: 3
position_size_quote: 10  # MARGIN per trade in USDT (notional = this × leverage)
connector_name: bitget_perpetual
position_mode: ONEWAY

# Exit geometry — SL 0.8% / TP 1.6% held. Trail arms earlier so greens lock
# instead of sitting until SL (1.2/0.8 never armed on typical +0.3–0.8% pops).
# Arm 0.5% / delta 0.3% (delta MUST be < arm or stop sits below entry).
stop_loss: 0.008
take_profit: 0.016
time_limit: 10800
trailing_stop: "0.005,0.003"
cooldown_time: 1500

# 0.66 = two engines (2/3). Solo SUPER_A ceiling was 0.58 — that is not an ensemble.
score_threshold: 0.66

crypto:
  # Engine 4 owns BTC+ETH at 100×.
  # Engine 2 20× basket (not E1): XAU, CL, DOGE, NEAR, LTC.
  - {symbol: SOL-USDT,  leverage: 10, tier: 2}
  - {symbol: XRP-USDT,  leverage: 10, tier: 1}
  - {symbol: BNB-USDT,  leverage: 5,  tier: 2}
  - {symbol: ADA-USDT,  leverage: 5,  tier: 2}
  - {symbol: AVAX-USDT, leverage: 5,  tier: 2}

commodities: []

stocks:
